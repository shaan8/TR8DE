# Default gitleaks rules, plus the public Anvil/Hardhat development keys used by the local test chain.
# These keys are published by Foundry and hold value only on a local chain.
[extend]
useDefault = true

[allowlist]
description = "Public Anvil development keys (local test chain only)"
regexes = [
  '''ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
]
